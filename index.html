function fbRefreshList(){ const l = $('#fbList'); if (l) l.innerHTML = fbListHTML(); $$('.fp-add').forEach(b => { const on = MYL.includes(b.dataset.id); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.innerHTML = on ? I.check + 'On my list' : I.plus + 'My list'; }); }
function cgView(v){
  CG.view = v; $('#cgBrowse').hidden = v !== 'browse'; $('#cgBook').hidden = v !== 'book';
  $$('.cg-views [data-cg="view"]').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  cgPill(); if (v === 'book' && !$('#fb')) mountBook(); cgTray();
}
function cgPill(){ const on = $('.cg-views .on'), p = $('#cgVp'); if (on && p){ p.style.width = on.offsetWidth + 'px'; p.style.transform = `translateX(${on.offsetLeft}px)`; } }
function mountCatalog(){
  if (!$('#catalog')) return;
  $('#cgSort').value = CG.sort;
  mountCgRing(); cgTray(); requestAnimationFrame(cgPill); addEventListener('resize', cgPill);
  let qt; $('#cgQ').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { CG.q = e.target.value.slice(0, 40); CG.limit = 500; cgRefresh(true); }, 160); });
  document.addEventListener('change', e => {
    const id = e.target.id; if (!['cgBrand','cgRange','cgSort','cgStock'].includes(id)) return;
    if (id === 'cgBrand') CG.brand = e.target.value; if (id === 'cgRange') CG.range = e.target.value; if (id === 'cgSort') CG.sort = e.target.value; if (id === 'cgStock') CG.stock = e.target.checked;
    CG.limit = 500; cgRefresh();
  });
  let lastTwo = innerWidth > 860; addEventListener('resize', () => { const t = innerWidth > 860; if (t !== lastTwo && $('#fb')){ lastTwo = t; const pi = FB.two ? FB.i * 2 : FB.i; FB.i = t ? Math.ceil(pi / 2) : Math.max(0, pi - 1); mountBook(); } });
  addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('#cgm').classList.contains('on')){ cgClose(); return; }
    if (W.page !== 'catalog' || CG.view !== 'book' || document.body.classList.contains('lock') || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight') fbSet(FB.i + 1); if (e.key === 'ArrowLeft') fbSet(FB.i - 1);
  });
  $('#cgm').addEventListener('click', e => { if (e.target.id === 'cgm') cgClose(); });
}
function cgSetCat(k){ CG.cat = k; CG.limit = 500; if (CG.view !== 'browse') cgView('browse'); cgRefresh(true); }

// catalog clicks (run before the site's own click handler)
document.addEventListener('click', e => {
  const a = e.target.closest('[data-cg]');
  // product links inside the catalog dialogs open the product on top
  if (!a){ const pc = e.target.closest('#cgm [data-pid]'); if (pc){ cgClose(); }
    const legacy = e.target.closest('[data-act="cat"],[data-act="audiocat"]');
    if (legacy){ e.preventDefault(); e.stopPropagation(); closeAll(true); cgSetCat(legacy.dataset.act === 'audiocat' ? 'audio' : legacy.dataset.k); nav('catalog'); }
    return; }
  if (W.dragged) return;
  e.preventDefault(); e.stopPropagation();
  const v = a.dataset.v, id = a.dataset.id;
  switch (a.dataset.cg){
    case 'cat': cgSetCat(a.dataset.k); return;
    case 'more': CG.limit += 24; cgRefresh(true); return;
    case 'reset': Object.assign(CG, { q:'', cat:'all', brand:'all', range:'all', stock:false, limit:500 }); $('#cgQ').value = ''; $('#cgBrand').value = 'all'; $('#cgRange').value = 'all'; $('#cgStock').checked = false; cgRefresh(true); return;
    case 'cmp': { const i = CG.cmp.indexOf(id); if (i >= 0) CG.cmp.splice(i, 1); else { if (CG.cmp.length >= 3){ toast('You can compare up to 3. Remove one first.'); return; } CG.cmp.push(id); }
      $$(`.cg-cmp[data-id="${id}"]`).forEach(b => { const on = CG.cmp.includes(id); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.innerHTML = `${on ? I.check : cgIco.cmp}<span>${on ? 'Comparing' : 'Compare'}</span>`; }); cgTray(); } return;
    case 'cmpclear': CG.cmp = []; $$('.cg-cmp.on').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-pressed', false); b.innerHTML = `${cgIco.cmp}<span>Compare</span>`; }); cgTray(); return;
    case 'compare': cgCompare(); return;
    case 'help': cgHelp(true); return;
    case 'hm': if (HM.step === 0) HM.cat = v; else if (HM.step === 1) HM.need = v; else HM.budget = v; HM.step++; cgHelp(); return;
    case 'hmback': HM.step = Math.max(0, HM.step - 1); cgHelp(); return;
    case 'hmagain': cgHelp(true); return;
    case 'close': cgClose(); return;
    case 'view': cgView(v); return;
    case 'fbprev': fbSet(FB.i - 1); return;
    case 'fbnext': fbSet(FB.i + 1); return;
    case 'fbgo': { const p = +a.dataset.p; fbSet(FB.two ? Math.ceil(p / 2) : p); } return;
    case 'myl': { const i = MYL.indexOf(id); i >= 0 ? MYL.splice(i, 1) : MYL.push(id); saveMyl(); fbRefreshList(); toast(i >= 0 ? 'Removed from my list' : 'Added to my list'); } return;
    case 'myl2cart': { const L = MYL.map(byId).filter(p => p && !p.soldOut); L.forEach(p => { const ex = S.cart.find(x => x.id === p.id && !x.ci && !x.oi); ex ? ex.qty = Math.min(99, ex.qty + 1) : S.cart.push({ id:p.id, ci:0, oi:0, qty:1 }); }); persist(); updateBadges(); toast(`${L.length} added to your cart`); } return;
  }
}, true);
addEventListener('hashchange', () => { cgClose(); setTimeout(() => { cgTray(); if (W.page === 'catalog') cgPill(); }, 30); });

// the new iSell logo (3D pill, Nov 2026) replaces the drawn one everywhere
const LOGO_IMG = 'img/i/836e26c5ff43.webp';
function logo3D(cls = ''){ return `<img class="logo3d ${cls}" src="${LOGO_IMG}" alt="iSell" draggable="false">`; }


/* ---------------- Dot, iSell's mascot + New in store ---------------- */
const DOTS = { hello:[292, 600], main:[350, 720] };
const dotHTML = (m = 'hello') => { const [w, h] = DOTS[m] || DOTS.hello; return `<span class="dot3d m-${m}"><span class="sh" aria-hidden="true"></span><img src="img/dot-${m}.webp" width="${w}" height="${h}" alt="" draggable="false" loading="lazy" decoding="async"></span>`; };
const waLink = msg => `${WA}?text=${encodeURIComponent(msg)}`;
const NEWIN = [
  { img:'new-iphone18-promax', w:800, h:694, op:'55% 40%', t:'iPhone 18 Pro Max', d:'Now in store. Ask us for today’s price and colours.', alt:'iPhone 18 Pro Max in deep red, close-up of the cameras', wa:'Hi iSell! Is the iPhone 18 Pro Max in stock? What is the price?' },
  { img:'new-iphone18-pro-colours', w:800, h:788, op:'50% 50%', t:'iPhone 18 Pro', d:'Four finishes: black, silver, blue and purple. Pick yours.', alt:'iPhone 18 Pro in black, silver, blue and purple, held in a hand', wa:'Hi iSell! Which colours of the iPhone 18 Pro do you have, and what is the price?' },
  { img:'new-cases-trio', w:736, h:810, op:'50% 45%', t:'Frosted magnetic cases', d:'Black, orange and white, with a built-in magnet ring.', alt:'Frosted phone cases in black, orange and white with a magnetic ring', wa:'Hi iSell! I would like a frosted magnetic case. Which phones and colours do you have?' },
  { img:'new-cases-colours', w:800, h:608, op:'58% 50%', t:'Soft-touch cases', d:'Colour that lasts, for the iPhone 17 series.', alt:'Soft-touch phone cases in grey, light grey, navy and orange', wa:'Hi iSell! I would like a soft-touch case for my iPhone 17. Which colours do you have?' }
];
const nwPrev = ic('<path d="m14.5 6-6 6 6 6"/>'), nwNext = ic('<path d="m9.5 6 6 6-6 6"/>');
function heroNew(){
  return `<div class="wrap nw" id="new">
    <div class="nw-bar rv d2">
      <div class="nw-dot" aria-hidden="true">${dotHTML('hello')}</div>
      <h2 class="nw-kick" id="nwH">Just landed</h2><span class="nw-hint" aria-hidden="true">Swipe for more →</span>
      <div class="nw-ctl"><button type="button" data-nw="-1" aria-label="Previous" disabled>${nwPrev}</button><button type="button" data-nw="1" aria-label="Next">${nwNext}</button></div>
    </div>
    <div class="nw-rail" id="nwRail" tabindex="0" role="region" aria-labelledby="nwH">
      ${NEWIN.map((n, i) => `<figure class="nw-card" style="--op:${n.op}">
        <div class="nw-ph" data-tilt><span class="nw-glass" aria-hidden="true"></span>
          <div class="nw-img"><img src="img/${n.img}.webp" width="${n.w}" height="${n.h}" alt="${esc(n.alt)}" ${i < 2 ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" draggable="false"></div>
          <span class="nw-no num" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span>
          <figcaption class="nw-cap"><span class="nw-t"><b>${esc(n.t)}</b><small>${esc(n.d)}</small></span><a class="nw-ask" href="${esc(waLink(n.wa))}" data-wa="${esc(n.wa)}" target="_blank" rel="noopener" aria-label="Ask about the ${esc(n.t)} on WhatsApp">${pfWa}</a></figcaption>
        </div>
      </figure>`).join('')}
    </div>
  </div>`;
}
function mountNew(){
  const rail = $('#nwRail'); if (!rail) return;
  const [bp, bn] = $$('.nw-ctl button'), cards = $$('.nw-card', rail);
  let raf = 0;
  const update = () => { raf = 0;
    const max = rail.scrollWidth - rail.clientWidth - 2;
    if (bp){ bp.disabled = rail.scrollLeft <= 2; bn.disabled = rail.scrollLeft >= max; }
    if (reduce) return;
    const r = rail.getBoundingClientRect(), mid = r.left + r.width / 2;
    cards.forEach(c => { const b = c.getBoundingClientRect(), off = (b.left + b.width / 2 - mid) / r.width;
      const k = Math.max(-1, Math.min(1, off)); c.style.setProperty('--px', (k * b.width * -.05).toFixed(1) + 'px'); c.style.setProperty('--ry', (k * -14).toFixed(2) + 'deg'); c.style.setProperty('--sc', (1 - Math.abs(k) * .05).toFixed(3)); });
  };
  const ask = () => { if (!raf) raf = requestAnimationFrame(update); };
  rail.addEventListener('scroll', ask, { passive:true }); addEventListener('resize', ask); ask();
  $('.nw-ctl').addEventListener('click', e => { const b = e.target.closest('[data-nw]'); if (!b) return;
    const step = (cards[0] ? cards[0].getBoundingClientRect().width : 300) + 20;
    rail.scrollBy({ left:step * +b.dataset.nw, behavior:reduce ? 'instant' : 'smooth' }); });
}
// WhatsApp links use the number from the live settings, even if it changed after the page drew
document.addEventListener('click', e => { const a = e.target.closest('a[data-wa]'); if (!a) return;
  a.href = waLink(a.dataset.wa); track('whatsapp_click', { from:a.closest('#dotx') ? 'dot' : 'new_in_store' }); }, true);

/* floating Dot helper: a friendly way to reach the shop on WhatsApp */
function mountDot(){
  if ($('#dotx')) return;
  const box = document.createElement('div'); box.className = 'dotx'; box.id = 'dotx';
  box.innerHTML = `<div class="dotx-card" id="dotxCard" role="dialog" aria-modal="false" aria-labelledby="dotxT" hidden>
      <button type="button" class="dotx-x" aria-label="Close">${ic('<path d="M6 6l12 12M18 6 6 18"/>')}</button>
      <div class="dotx-hi">${dotHTML('hello')}<p><b id="dotxT">Hi, I’m Dot!</b>Looking for a gadget, a repair or a price? The iSell team replies fast on WhatsApp.</p></div>
      <a class="dotx-a pri" href="${esc(waLink('Hi iSell! I have a question.'))}" data-wa="Hi iSell! I have a question." target="_blank" rel="noopener">${pfWa}Chat on WhatsApp</a>
      <a class="dotx-a" href="#/catalog">${I.grid}Open the catalog</a>
    </div>
    <p class="dotx-peek" id="dotxPeek" hidden>Hi! I’m Dot. Need help finding something?</p>
    <button type="button" class="dotx-btn" id="dotxBtn" aria-expanded="false" aria-controls="dotxCard" aria-label="Ask Dot for help"><img src="img/dot-head.webp" width="320" height="320" alt="" draggable="false"></button>`;
  document.body.appendChild(box);
  const card = $('#dotxCard'), btn = $('#dotxBtn'), peek = $('#dotxPeek');
  const set = open => { card.hidden = !open; btn.setAttribute('aria-expanded', open); peek.hidden = true;
    if (open){ $('.dotx-a', card).focus({ preventScroll:true }); track('dot_open'); } };
  btn.addEventListener('click', () => set(card.hidden));
  $('.dotx-x', card).addEventListener('click', () => { set(false); btn.focus(); });
  card.addEventListener('click', e => { if (e.target.closest('a')) set(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !card.hidden){ set(false); btn.focus(); } });
  document.addEventListener('pointerdown', e => { if (!card.hidden && !box.contains(e.target)) set(false); });
  // say hello once per visit, then get out of the way
  let seen = false; try { seen = sessionStorage.getItem('isell_dot_hi') === '1'; sessionStorage.setItem('isell_dot_hi', '1'); } catch (e) {}
  if (!seen){ setTimeout(() => { if (card.hidden) peek.hidden = false; }, 4000); setTimeout(() => { peek.hidden = true; }, 9500); }
  peek.addEventListener('click', () => set(true));
}

})();
