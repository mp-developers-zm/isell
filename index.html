.feed{overflow:hidden}
.fd-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px 40px;flex-wrap:wrap;margin-bottom:clamp(24px,3vw,40px)}
.fd-r{display:flex;flex-direction:column;align-items:flex-start;gap:16px;max-width:42ch}
.fd-r p{margin:0;color:var(--ink2)}
.fd-nav{display:flex;gap:8px}
.fd-nav .ib{width:50px;height:50px}
.fd-row{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px max(var(--gut),calc((100vw - var(--wrap)) / 2 + var(--gut))) 40px;scrollbar-width:none;cursor:grab}
.fd-row::-webkit-scrollbar{display:none}
.post{flex:none;width:clamp(260px,24vw,320px);scroll-snap-align:start;border-radius:30px;padding:12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;background:linear-gradient(160deg,rgba(255,255,255,.8),rgba(255,255,255,.45));transition:transform .5s var(--spring),box-shadow .4s}
.post:hover{transform:translateY(-6px)}
.post header{display:flex;align-items:center;gap:10px;padding:2px 4px}
.post .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#EEE6FD);box-shadow:inset 0 0 0 1.5px var(--p2)}
.post .who{display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0}
.post .who b{font:600 14px var(--f-ui)}.post .who small{font-size:12px;color:var(--ink3)}
.ptg{font:600 10px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--p2);padding:6px 10px;border-radius:999px;background:rgba(125,75,219,.1)}
.ptg.sale{color:#fff;background:linear-gradient(180deg,#E0569B,#B0367A)}
.pm{position:relative;aspect-ratio:1;border-radius:22px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(70% 60% at 30% 20%,#fff,rgba(255,255,255,0) 60%),linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,#EFE7FF),color-mix(in srgb,var(--c) 12%,#F8D9F0))}
.pm img{position:relative;z-index:1;width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(59,22,128,.3));transition:transform .7s var(--spring)}
.post:hover .pm img{transform:scale(1.06) rotate(-3deg)}
.pa{display:flex;align-items:center;gap:6px;padding:0 4px}
.pa .fav2,.pa .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:transform .35s var(--spring),color .3s}
.pa .fav2 svg,.pa .ic svg{width:22px;height:22px}
.pa .fav2:hover,.pa .ic:hover{transform:scale(1.12);color:var(--p)}
.pa .fav2.on{color:#D2367F}.pa .fav2.on svg{fill:currentColor}
.pa b{font:600 17px var(--f-ui);letter-spacing:-.02em}.pa s{font-size:13px;color:var(--ink3);margin-left:4px}
.post .cap{margin:0;padding:0 4px;font-size:13.5px;line-height:1.45;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.post .cap b{color:var(--ink);margin-right:4px}
.btn.full{width:100%}

/* ---- proof ---- */
.proof{overflow:hidden;background:radial-gradient(50% 60% at 80% 20%,rgba(255,214,240,.6),rgba(255,214,240,0) 60%),radial-gradient(50% 60% at 10% 60%,rgba(212,194,255,.6),rgba(212,194,255,0) 60%)}
.pf-head{text-align:center;display:flex;flex-direction:column;align-items:center}
.pf-head .scr{transform-origin:center}
.pf-head p{max-width:46ch;color:var(--ink2);margin:14px 0 0}
.pf-sky{position:relative;height:clamp(300px,34vw,440px);max-width:1300px;margin:0 auto}
.pfb{position:absolute;left:var(--x);top:var(--y);padding:0;transform:translate(-50%,-50%);animation:pfFloat var(--d) ease-in-out infinite alternate}
.pfb:nth-child(2n){animation-direction:alternate-reverse}
@keyframes pfFloat{from{translate:0 -10px}to{translate:6px 14px}}
.orb{display:grid;place-items:center;width:calc(var(--s) * 1.25);height:calc(var(--s) * 1.25);transition:transform .6s var(--spring)}
.orb img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(59,22,128,.28)) drop-shadow(0 5px 6px rgba(59,22,128,.16))}
.pfb:hover .orb,.pfb:focus-visible .orb{transform:scale(1.12) rotate(-4deg)}
.pop{position:absolute;left:50%;bottom:calc(100% + 10px);display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 16px;border-radius:18px;white-space:nowrap;font-size:13px;opacity:0;transform:translate(-50%,8px) scale(.94);transition:opacity .3s,transform .45s var(--spring);pointer-events:none;background:rgba(255,255,255,.7)}
.pop b{font:600 13.5px var(--f-ui)}.pop .num{color:var(--p);font-weight:600}
.pfb:hover .pop,.pfb:focus-visible .pop{opacity:1;transform:translate(-50%,0) scale(1)}
.pf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pf-stats .st{border-radius:28px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:6px}
.pf-stats b{font:600 clamp(40px,5vw,72px)/1 var(--f-ui);letter-spacing:-.05em;color:var(--pdd)}
.pf-stats small{font-size:14px;color:var(--ink2);line-height:1.4}
@media (max-width:860px){.pf-stats{grid-template-columns:1fr 1fr}.pf-sky .pfb:nth-child(n+6){display:none}}

/* ---- crossing bands ---- */
.bands{position:relative;height:clamp(120px,12vw,170px);margin:0;overflow:hidden}
.bd{position:absolute;left:-5%;right:-5%;top:50%;height:clamp(48px,5vw,66px);display:flex;align-items:center;overflow:hidden}
.bd1{background:linear-gradient(90deg,#25094F,#3B1680 50%,#25094F);color:#fff;transform:translateY(-70%) rotate(-3.5deg);z-index:2;box-shadow:0 20px 40px -20px rgba(37,9,79,.6)}
.bd2{background:linear-gradient(90deg,rgba(226,210,255,.85),rgba(255,214,240,.85));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--pd);transform:translateY(-20%) rotate(2.5deg);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9)}
.bt{display:flex;align-items:center;gap:22px;white-space:nowrap;font:600 clamp(16px,1.8vw,24px) var(--f-ui);letter-spacing:-.01em;animation:bandL 38s linear infinite;padding-left:22px}
.bd2 .bt{animation-name:bandR;animation-duration:44s}
.bt i{font-style:normal;color:#D58AF0}
.bd2 .bt i{color:#B0479F}
@keyframes bandL{to{transform:translateX(-33.333%)}}
@keyframes bandR{from{transform:translateX(-33.333%)}to{transform:none}}

/* the old floating scene styles stay for other pages; the home header sits on the sky */
body.home-top .burger{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);box-shadow:inset 0 1.5px 1px #fff,inset 0 0 0 1px rgba(255,255,255,.7)}
@media (prefers-reduced-motion: reduce){.pfb{animation:none}.bt{animation:none}}

/* the iSell logo wherever the name stood alone */
.logo3d{text-transform:none;letter-spacing:0}
.mc-brand .logo3d{width:78px;height:auto;filter:drop-shadow(0 4px 6px rgba(40,15,90,.25))}
.foot h4.h4-logo{margin-bottom:10px}.foot h4.h4-logo .logo3d{width:84px;height:auto}
.foot-big{-webkit-text-stroke:0;line-height:0;opacity:.16}.foot-big .logo3d{width:min(86vw,820px);height:auto}

/* ---- customer accounts ---- */
.ac-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:18px;border-radius:999px;background:rgba(91,46,158,.07)}
.ac-tabs button{height:42px;border-radius:999px;font:600 14px var(--f-ui);color:var(--ink2);transition:background .3s,color .3s,box-shadow .3s}
.ac-tabs button.on{background:#fff;color:var(--p);box-shadow:0 2px 8px -2px rgba(59,22,128,.25)}
.ac-form{display:flex;flex-direction:column;gap:2px}
.ac-form .btn.full{margin-top:8px}
.ac-form .lnk{align-self:center;margin-top:12px}
.ac-form .proto{display:block;margin-top:10px;font-size:12.5px;color:var(--ink3);line-height:1.5}
.ac-form .proto a{color:var(--p);text-decoration:underline}
.ac-chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0 4px;font-size:14px;color:var(--ink2);cursor:pointer}
.ac-chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--p);flex:none}
.ac-msg{margin:0 0 14px;padding:10px 14px;border-radius:14px;background:#F4EEFF;color:var(--pd);font-size:14px;box-shadow:inset 0 0 0 1px var(--line2)}
.ac-sm{margin:10px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.5}
.ac-dash .ac-wide{grid-column:1/-1}
.ac-dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:12px 0 14px;font-size:14.5px}
.ac-dl dt{color:var(--ink3)}.ac-dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.lnk svg{width:16px;height:16px}
.ac-orders{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ac-o{padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.65);box-shadow:inset 0 0 0 1px var(--line)}
.ac-oh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:14px;color:var(--ink2)}
.ac-oh b{color:var(--ink)}.ac-tot{margin-left:auto;font-size:16px}
.ac-st{padding:4px 10px;border-radius:999px;font:600 12px var(--f-ui);background:#FFF4DC;color:#8A5A00}
.ac-st.confirmed,.ac-st.paid{background:#EEE6FF;color:var(--p)}.ac-st.ready{background:#E3F1FF;color:#1F5FA8}.ac-st.delivered{background:#E3F6EA;color:#1D7A43}.ac-st.cancelled{background:#F3F0F7;color:var(--ink3)}
.ac-its{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ac-it{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-size:13px;transition:transform .35s var(--spring)}
.ac-it:hover{transform:translateY(-2px)}
.ac-it img{width:34px;height:34px;object-fit:contain;border-radius:50%;background:#F4F0FB}
.ac-favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.ac-fv{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border-radius:22px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px var(--line);text-align:center;transition:transform .45s var(--spring)}
.ac-fv:hover{transform:translateY(-4px)}
.ac-fv img{width:100%;height:110px;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(59,22,128,.2))}
.ac-fv b{font:600 14px var(--f-ui)}.ac-fv span{font-size:13.5px;color:var(--p);font-weight:600}
.tools .ib.acct.in{background:linear-gradient(180deg,#7A48D6,#5B2E9E);color:#fff;box-shadow:0 3px 0 #3B1680}

/* ===== v4 home: iSell Innovations company profile, light studio + 3D liquid glass =====
   VOICE premium and calm. IDEA a product studio: one big lowercase word with the product standing in front.
   COLOUR studio grey-white, ink deep iSell purple, lilac light. TYPE Outfit for display, Geist for text. */
:root{--f-d:"Outfit","Geist",system-ui,sans-serif;--hxbg:#EFEDF4;--hxk:#211336;--hxp:#5B2E9E;--hxl:#A27BFF;--pk:#2A1050;--pv:#6C3BD1;--pm:#B595FF}
body:has(.spage[data-page="home"]:not([hidden])){background:var(--hxbg)}
.hx{padding-bottom:20px}
.lg{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.82),rgba(255,255,255,.42) 60%,rgba(255,255,255,.6));-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1.5px 1px #fff,inset 0 -10px 22px rgba(108,59,209,.07),0 1px 2px rgba(33,19,54,.05),0 22px 44px -26px rgba(33,19,54,.38)}
.lg::after{content:"";position:absolute;inset:1px;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.35) 100%);mix-blend-mode:soft-light}
.lg2{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 20px 40px -24px rgba(0,0,0,.5)}
.pf-eb{display:inline-flex;align-items:center;gap:10px;font:500 15px var(--f-ui);letter-spacing:-.005em;color:var(--hxp)}

/* pills and round buttons */
.hx-btns{display:flex;gap:10px;flex-wrap:wrap}
.hx-pill{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 8px;border-radius:999px;font:500 16px var(--f-ui);letter-spacing:-.01em;color:var(--hxp);background:none;transition:transform .35s var(--spring),background .3s,color .3s;white-space:nowrap}
.hx-pill svg{width:16px;height:16px}
.hx-pill:hover{text-decoration:underline;text-underline-offset:4px}
.hx-pill.dk{padding:0 26px;background:var(--hxk);color:#fff;box-shadow:0 12px 24px -14px rgba(33,19,54,.7)}
.hx-pill.dk:hover{background:#3A2560;text-decoration:none;transform:translateY(-1px)}
.hx-pill.sm{height:36px;padding:0 16px;font-size:12px}
.hx-pill.wh{padding:0 26px;background:#fff;color:var(--hxk)}.hx-pill.wh:hover{text-decoration:none;transform:translateY(-1px)}
.hx-pill.gl{color:#fff}
.hx-bag{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#E9E4F3);color:var(--hxk);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(33,19,54,.1),0 8px 16px -8px rgba(33,19,54,.4);transition:transform .35s var(--spring)}
.hx-bag svg{width:19px;height:19px}.hx-bag:hover{transform:scale(1.08) rotate(-6deg)}
.hx-bag.dk{background:radial-gradient(circle at 35% 30%,#5A3A92,#211336 70%);color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 10px 20px -8px rgba(33,19,54,.7)}
.ol{display:inline-block;padding:0 .45em;border-radius:999px;box-shadow:inset 0 0 0 2px currentColor;line-height:1.25}
.fl{display:inline-block;padding:0 .45em;border-radius:999px;line-height:1.25;color:#fff;background:var(--hxp)}

/* hide the promo ticker while the company profile is on screen: calmer first impression */
body:has(.spage[data-page="home"]:not([hidden])) .announce{display:none}

/* hero: the glossy logo in front of a huge "innovations." */
.hx-hero{padding-top:6px}
.hx-stage{position:relative;height:clamp(600px,calc(100svh - 120px),860px);border-radius:44px;overflow:hidden;background:#F7F6FA;box-shadow:inset 0 2px 0 #fff,inset 0 -30px 60px rgba(108,59,209,.06),0 40px 80px -50px rgba(33,19,54,.45);isolation:isolate;perspective:1400px}
.hx-glow{position:absolute;left:50%;top:22%;width:60%;height:50%;transform:translateX(-50%);background:radial-gradient(50% 50%,rgba(255,255,255,.9),transparent 70%);filter:blur(30px);z-index:-1}
.hx-net{position:absolute;inset:0;color:rgba(91,46,158,.06);z-index:-1}.hx-net svg{width:100%;height:100%}
.hx-word{position:absolute;left:50%;top:30%;margin:0;transform:translateX(-50%);font:500 clamp(84px,14.5vw,232px)/.8 var(--f-d);letter-spacing:-.07em;color:var(--hxk);white-space:nowrap;opacity:0;transition:opacity 1.4s .15s;z-index:0}
.hx-word b{color:var(--hxp);font-weight:600}
.hx-stage.on .hx-word{opacity:1}
.hx-obj{position:absolute;left:50%;top:12%;width:min(38%,470px);margin-left:calc(min(38%,470px) / -2);z-index:2;transform-style:preserve-3d;will-change:transform}
.hx-logo{animation:hxFloat 7s ease-in-out infinite}
.hx-logo img.logo3d{width:100%;filter:drop-shadow(0 30px 30px rgba(33,19,54,.28)) drop-shadow(0 4px 6px rgba(33,19,54,.18));animation:hxIn 1.3s .2s var(--out) both}
.hx-shadow{position:absolute;left:12%;right:12%;bottom:-18%;height:16%;border-radius:50%;background:radial-gradient(50% 50%,rgba(33,19,54,.28),transparent 70%);filter:blur(10px);animation:hxShadow 7s ease-in-out infinite}
@keyframes hxFloat{50%{transform:translateY(-14px) rotateZ(-1deg)}}
@keyframes hxShadow{50%{transform:scaleX(.86);opacity:.7}}
@keyframes hxIn{from{opacity:0;transform:translateY(40px) scale(.92)}}
.hx-do{position:absolute;left:24px;top:24px;z-index:3;display:flex;gap:6px;padding:7px;border-radius:24px}
.hx-do a{display:flex;flex-direction:column;align-items:center;gap:5px;width:74px;padding:10px 4px 8px;border-radius:17px;font:500 11.5px var(--f-ui);color:var(--hxk);transition:background .3s,transform .35s var(--spring)}
.hx-do a:hover{background:#fff;transform:translateY(-2px)}
.hx-do i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--hxp)}
.hx-do i svg{width:17px;height:17px}
.hx-intro{position:absolute;left:clamp(22px,4vw,52px);bottom:clamp(22px,3.6vw,44px);z-index:3;max-width:440px;display:flex;flex-direction:column;gap:12px}
.hx-intro h1{font:500 clamp(36px,4.2vw,60px)/1 var(--f-d);letter-spacing:-.045em;color:var(--hxk)}
.hx-intro p{font-size:16px;line-height:1.6;color:var(--ink2);max-width:40ch}
.hx-intro .hx-btns{margin-top:6px}
.hx-side{position:absolute;right:clamp(22px,4vw,52px);bottom:clamp(26px,3.8vw,48px);z-index:3;display:flex;align-items:center;gap:14px;text-align:left}
.hx-side b{font:500 64px/1 var(--f-d);color:var(--hxp);letter-spacing:-.04em}
.hx-side span{font-size:13.5px;line-height:1.45;color:var(--ink2)}

/* section label row */
.hx-sec{padding-top:clamp(70px,9vw,120px);scroll-margin-top:90px}
.hx-lab{display:flex;align-items:center;gap:16px;margin-bottom:clamp(24px,3.4vw,40px)}
.hx-lab span{font:500 15px var(--f-ui);letter-spacing:-.005em;color:var(--hxk);white-space:nowrap}
.hx-lab i{flex:1;height:1px;background:rgba(33,19,54,.16)}
.hx-lab b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--hxk);color:var(--hxk)}.hx-lab b svg{width:16px;height:16px}
.hx-h{font:500 clamp(36px,4.6vw,64px)/1.02 var(--f-d);letter-spacing:-.045em;color:var(--hxk)}
.hx-p{color:var(--ink2);font-size:clamp(15.5px,1.3vw,17px);line-height:1.7;max-width:54ch}
.hx-two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,60px);align-items:end;margin-bottom:clamp(28px,3.6vw,44px)}

/* what we do: four large cards */
.hx-wd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,24px)}
.hx-w{display:flex;flex-direction:column;gap:12px;scroll-margin-top:120px}
.hx-w-img{position:relative;aspect-ratio:16/10;border-radius:32px;overflow:hidden;background:#DCD7E6;box-shadow:0 30px 60px -44px rgba(33,19,54,.6)}
.hx-w-img>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--out)}
.hx-w:hover .hx-w-img>img{transform:scale(1.04)}
.hx-w-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(33,19,54,0) 55%,rgba(33,19,54,.35));pointer-events:none}
.hx-w-img.gadgets{background:radial-gradient(70% 80% at 50% 40%,#fff,#E6E1F0 80%)}
.hx-w-img.gadgets::after{display:none}
.hx-w-prods{position:absolute;inset:8% 6% 4%;display:flex;align-items:flex-end;justify-content:center}
.hx-w-prods img{height:88%;width:auto;max-width:42%;object-fit:contain;margin:0 -3%;filter:drop-shadow(0 24px 20px rgba(33,19,54,.28));transform:translateY(calc((var(--j) - 1) * (var(--j) - 1) * 6%)) rotate(calc((var(--j) - 1) * 6deg));transition:transform .8s var(--spring)}
.hx-w-prods img:nth-child(2){height:100%;z-index:1}
.hx-w:hover .hx-w-prods img{transform:translateY(calc((var(--j) - 1) * (var(--j) - 1) * 4% - 3%)) rotate(calc((var(--j) - 1) * 9deg))}
.hx-w-n{position:absolute;left:20px;top:18px;z-index:1;padding:6px 12px;border-radius:999px;font:500 13px var(--f-ui);color:var(--hxk);background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 #fff}
.hx-w-bar{display:flex;align-items:center;gap:14px;padding:10px 10px 10px 12px;border-radius:28px;background:#fff;box-shadow:0 16px 34px -26px rgba(33,19,54,.5)}
.hx-w-bar>i{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--hxp)}
.hx-w-bar>i svg{width:20px;height:20px}
.hx-w-bar>span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hx-w-bar b{font:500 19px var(--f-d);letter-spacing:-.02em;color:var(--hxk)}
.hx-w-bar small{font-size:13.5px;line-height:1.45;color:var(--ink2)}
.hx-w-go{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-style:normal;color:var(--hxk);box-shadow:inset 0 0 0 1.5px var(--hxk);transition:background .3s,color .3s,transform .4s var(--spring)}
.hx-w-go svg{width:18px;height:18px}
.hx-w:hover .hx-w-go{background:var(--hxk);color:#fff;transform:rotate(45deg)}

/* about block */
.hx-ft{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(14px,2vw,22px)}
.hx-ft-h{display:flex;flex-direction:column;gap:18px;justify-content:flex-end;padding:4px 0 8px}
.hx-ft-h h2{font:500 clamp(52px,6.6vw,98px)/.92 var(--f-d);letter-spacing:-.06em;color:var(--hxk)}
.hx-dot{color:var(--hxp)}
.hx-spec{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 24px;margin:0;padding:clamp(22px,2.8vw,34px);border-radius:32px;align-content:center}
.hx-spec dt{font-size:12.5px;color:var(--ink3)}.hx-spec dd{margin:3px 0 0;font:500 18px var(--f-d);color:var(--hxk);letter-spacing:-.01em}
.hx-ft-a{position:relative;border-radius:32px;overflow:hidden;min-height:360px;background:#DCD7E6}
.hx-ft-a img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hx-ft-b{display:flex;flex-direction:column;justify-content:space-between;gap:26px;padding:clamp(22px,3vw,40px);border-radius:32px;background:#fff;box-shadow:0 24px 44px -34px rgba(33,19,54,.45)}
.hx-caps{font:500 clamp(18px,1.8vw,24px)/1.55 var(--f-d);text-transform:uppercase;letter-spacing:.005em;color:var(--hxk)}
.hx-brandrow{display:flex;flex-wrap:wrap;gap:10px 22px;padding-top:20px;border-top:1px solid rgba(33,19,54,.1)}
.hx-brandrow span{font:500 18px var(--f-d);letter-spacing:-.02em;color:rgba(33,19,54,.5)}

/* vision */
.hx-vis{border-radius:40px;padding:clamp(36px,6vw,90px);overflow:hidden;background:#0E0A16!important;border:0!important;box-shadow:none!important}.hx-vis::after{display:none}
.hx-vis-bg{display:none}
.hx-vw{position:relative;font:500 clamp(30px,4.4vw,64px)/1.12 var(--f-d);letter-spacing:-.045em;max-width:22ch}
.hx-vw .w{color:rgba(255,255,255,.14);transition:color .5s}.hx-vw .w.lit{color:#fff}

/* services: calm numbered list */
.hx-sv{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(20px,4vw,60px);align-items:stretch}
.hx-sv-img{position:relative;border-radius:36px;overflow:hidden;min-height:480px;background:#DCD7E6}
.hx-sv-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hx-sv-chip{position:absolute;left:18px;bottom:18px;display:flex;align-items:center;gap:12px;padding:12px 18px 12px 16px;border-radius:22px}
.hx-sv-chip b{font:500 40px/1 var(--f-d);color:var(--hxp)}.hx-sv-chip span{font-size:13px;color:var(--hxk);line-height:1.35}
.hx-sv-r{display:flex;flex-direction:column;gap:24px;justify-content:center}
.hx-sl{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;column-gap:28px;border-top:1px solid rgba(33,19,54,.12)}
.hx-sl li{display:flex;align-items:baseline;gap:14px;padding:16px 0;border-bottom:1px solid rgba(33,19,54,.12);font:500 16.5px var(--f-d);letter-spacing:-.01em;color:var(--hxk)}
.hx-sl li span{font:500 11.5px var(--f-ui);color:var(--hxp)}
.hx-sv-r .hx-pill{align-self:flex-start}

/* values */
.hx-vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(33,19,54,.12)}
.hx-val{padding:26px 26px 30px 0;border-bottom:1px solid rgba(33,19,54,.12);display:flex;flex-direction:column;gap:8px}
.hx-val:not(:nth-child(3n+1)){padding-left:26px;border-left:1px solid rgba(33,19,54,.12)}
.hx-val span{font-size:12px;color:var(--hxp)}
.hx-val b{font:500 22px var(--f-d);letter-spacing:-.025em;color:var(--hxk)}
.hx-val p{font-size:15px;color:var(--ink2);line-height:1.55}

/* clients & compliance */
.hx-tc{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(14px,2vw,22px)}
.hx-tc-l{border-radius:32px;padding:clamp(22px,3vw,40px);display:flex;flex-direction:column;gap:12px}
.hx-tc-l h3{font:500 clamp(26px,2.6vw,36px)/1.05 var(--f-d);letter-spacing:-.04em;color:var(--hxk)}
.hx-cl{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.hx-cl li{padding:14px 0;border-top:1px solid rgba(33,19,54,.1);font:500 17px var(--f-d);letter-spacing:-.015em;color:var(--hxk)}
.hx-cp{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4vw,14px)}
.hx-cpc{border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:3px}
.hx-cpa{align-self:flex-start;padding:5px 12px;border-radius:999px;font:600 13px var(--f-ui);letter-spacing:.02em;color:#fff;background:var(--hxk);margin-bottom:14px}
.hx-cpc small{font-size:12.5px;color:var(--ink3)}.hx-cpc b{font:500 clamp(17px,1.6vw,21px) var(--f-d);color:var(--hxk);word-break:break-all}

/* catalog banner */
.hx-shop{position:relative;display:grid;grid-template-columns:.9fr 1.1fr;align-items:center;gap:20px;border-radius:40px;padding:clamp(26px,4vw,56px);overflow:hidden;background:#fff;box-shadow:inset 0 2px 0 #fff,0 30px 60px -44px rgba(33,19,54,.5)}
.hx-shop h2{font:500 clamp(36px,4.4vw,60px)/1 var(--f-d);letter-spacing:-.045em;color:var(--hxk);margin:12px 0}
.hx-shop p{color:var(--ink2);max-width:38ch;margin-bottom:22px;line-height:1.6}
.hx-shop .hx-pill.wh{background:var(--hxk);color:#fff}
.hx-shop-p{position:relative;height:clamp(220px,26vw,320px)}
.hx-shop-p img{position:absolute;bottom:0;height:calc(88% - var(--i) * 0%);max-width:34%;object-fit:contain;filter:drop-shadow(0 26px 22px rgba(33,19,54,.28));left:calc(var(--i) * 16.5%);transition:transform .8s var(--spring)}
.hx-shop-p img:nth-child(odd){height:72%}
.hx-shop:hover .hx-shop-p img{transform:translateY(-10px)}

/* let's talk */
.hx-talk{position:relative;border-radius:44px;overflow:hidden;padding:clamp(34px,5vw,70px);background:#0E0A16;color:#fff;isolation:isolate}
.hx-talk-bg{position:absolute;inset:0;z-index:-1}
.hx-talk-bg img{position:absolute;right:0;top:0;width:60%;height:100%;object-fit:cover;opacity:.26;-webkit-mask:linear-gradient(90deg,transparent,#000 70%);mask:linear-gradient(90deg,transparent,#000 70%)}
.hx-tw{font:500 clamp(70px,12vw,190px)/.85 var(--f-d);letter-spacing:-.07em;margin:0 0 clamp(26px,4vw,44px)}
.hx-tw b{color:var(--hxl);font-weight:600}
.hx-talk-g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hx-row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:26px;transition:transform .4s var(--out),background .3s}
a.hx-row:hover{transform:translateY(-3px);background:rgba(255,255,255,.14)}
.hx-row>i{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--pv)}
.hx-row>i svg{width:20px;height:20px}
.hx-row>span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hx-row small{font-size:13px;color:var(--hxl)}
.hx-row b{font-weight:500;font-size:16px}.hx-row .hx-ln{font-size:13.5px;color:rgba(255,255,255,.66)}
.hx-row>svg{width:18px;height:18px;opacity:.6;flex:none}
.hx-tels{display:flex;flex-wrap:wrap;gap:2px 16px}.hx-tels a{font-weight:500;font-size:15.5px;color:#fff!important}
.hx-talk-b{margin-top:20px}

@media (max-width:1000px){
  .hx-two,.hx-sv,.hx-ft,.hx-tc,.hx-shop{grid-template-columns:1fr}
  .hx-vals{grid-template-columns:1fr 1fr}
  .hx-val{padding-left:0!important;border-left:0!important;padding-right:20px}
  .hx-talk-g{grid-template-columns:1fr}
  .hx-side{display:none}
  .hx-obj{width:min(62%,520px);margin-left:calc(min(62%,520px) / -2)}
}
@media (max-width:700px){
  .hx-stage{height:auto;padding:110px 18px 26px;display:flex;flex-direction:column;align-items:center;border-radius:34px}
  .hx-word{position:relative;left:auto;top:auto;transform:none!important;font-size:21vw;order:1}
  .hx-obj{position:relative;left:auto;top:auto;width:84%;margin:-13vw 0 0;order:2}
  .hx-do{left:50%;top:16px;transform:translateX(-50%);gap:2px;padding:5px}
  .hx-do a{width:68px;font-size:10.5px;padding:8px 2px 6px}
  .hx-intro{position:relative;left:auto;bottom:auto;order:3;margin-top:46px;align-items:center;text-align:center}
  .hx-intro .hx-btns{justify-content:center}
  .hx-wd{grid-template-columns:1fr}
  .hx-w-bar small{display:none}
  .hx-sl,.hx-cl{grid-template-columns:1fr}
  .hx-vals{grid-template-columns:1fr}
  .hx-spec{grid-template-columns:1fr 1fr}
  .hx-ft-a{min-height:260px}
  .hx-sv-img{min-height:300px}
  .hx-cp{grid-template-columns:1fr 1fr}
}

/* ===== profile "slides": white panels with tabs, bold heading, number tiles, cut-out objects ===== */
.sl{position:relative;border-radius:36px;background:#fff;padding:clamp(22px,3.4vw,44px);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 30px 60px -46px rgba(33,19,54,.5);overflow:hidden}
.sl::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(rgba(33,19,54,.07) 1.2px,transparent 1.3px) 0 0/16px 16px;-webkit-mask:radial-gradient(70% 70% at 80% 30%,#000,transparent 70%);mask:radial-gradient(70% 70% at 80% 30%,#000,transparent 70%)}
.sl>*{position:relative}
.sl-tabs{display:flex;gap:22px;margin-bottom:clamp(20px,3vw,34px);overflow-x:auto;scrollbar-width:none}
.sl-tabs::-webkit-scrollbar{display:none}
.sl-tabs a{flex:none;font-size:13.5px;color:var(--ink3);padding-bottom:4px;border-bottom:1.5px solid transparent;transition:color .3s}
.sl-tabs a:hover{color:var(--hxk)}.sl-tabs a.on{color:var(--hxp);border-color:var(--hxp)}
.sl-h{font:600 clamp(32px,3.6vw,50px)/1.02 var(--f-d);letter-spacing:-.04em;color:var(--hxk)}
.sl-p{font-size:clamp(15px,1.25vw,16.5px);line-height:1.65;color:var(--ink2);max-width:50ch}
.sl-top{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,3vw,48px);align-items:end;margin-bottom:clamp(22px,3vw,36px)}

/* number tiles */
.sl-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sl-tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.sl-tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{position:relative;min-height:112px;padding:16px 18px;border-radius:18px;background:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;box-shadow:0 0 0 1px rgba(33,19,54,.08),0 14px 28px -22px rgba(33,19,54,.45)}
.tile b{font:600 clamp(26px,2.6vw,36px)/1.05 var(--f-d);letter-spacing:-.035em;color:var(--hxk)}
.tile b.sm{font-size:clamp(18px,1.8vw,23px);letter-spacing:-.01em;word-break:break-all}
.tile span{font-size:13px;color:var(--ink2);line-height:1.35}
.tile>svg{position:absolute;right:14px;top:14px;width:16px;height:16px;color:var(--hxp)}
.tile.pk{background:var(--hxp);box-shadow:0 16px 30px -18px rgba(91,46,158,.8)}
.tile.pk b,.tile.pk span,.tile.pk>svg{color:#fff}
.tile.gy{background:#EEEBF3;box-shadow:none}

/* what we do: four category cards with objects on a purple blob */
.sl-cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sl-cat{position:relative;display:flex;flex-direction:column;gap:8px;min-height:380px;padding:20px;border-radius:24px;background:#fff;box-shadow:0 0 0 1px rgba(33,19,54,.08);overflow:hidden;transition:transform .5s var(--out),box-shadow .4s;scroll-margin-top:120px}
.sl-cat:hover{transform:translateY(-4px);box-shadow:0 0 0 1px rgba(33,19,54,.08),0 30px 50px -34px rgba(33,19,54,.55)}
.sl-cat b{font:600 19px/1.15 var(--f-d);letter-spacing:-.025em;color:var(--hxk)}
.sl-cat p{font-size:13.5px;line-height:1.5;color:var(--ink2)}
.sl-cat-o{position:relative;flex:1;min-height:150px;margin:6px -20px 0}
.sl-cat-o .blob{position:absolute;left:-14%;bottom:-30%;width:78%;aspect-ratio:1;border-radius:50%;background:var(--hxp)}
.sl-cat-o img{position:absolute;right:6%;bottom:6%;height:92%;max-width:84%;object-fit:contain;filter:drop-shadow(0 18px 16px rgba(33,19,54,.3));transition:transform .7s var(--spring)}
.sl-cat:hover .sl-cat-o img{transform:translateY(-6px) rotate(-3deg)}
.sl-cat-o i{position:absolute;right:16%;bottom:22%;width:96px;height:96px;border-radius:28px;display:grid;place-items:center;background:#fff;color:var(--hxp);box-shadow:0 20px 30px -16px rgba(33,19,54,.5)}
.sl-cat-o i svg{width:44px;height:44px}
.sl-cat em{position:absolute;left:20px;bottom:18px;z-index:1;font-style:normal;font-size:14px;color:#fff;display:flex;align-items:center;gap:6px}.sl-cat em svg{width:15px;height:15px}

/* who we are */
.sl-who{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(16px,3vw,40px)}
.sl-who-l{display:flex;flex-direction:column;gap:14px}
.sl-card{padding:20px 22px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px rgba(33,19,54,.08),0 14px 28px -22px rgba(33,19,54,.45)}
.sl-card small{display:block;font-weight:600;font-size:14px;color:var(--hxk);margin-bottom:6px}.sl-card p{font-size:14.5px;line-height:1.6;color:var(--ink2)}
.sl-who-r{display:flex;flex-direction:column;gap:18px}
.sl-obj{position:relative;flex:1;min-height:300px;display:grid;place-items:center;border-radius:24px;background:#F4F2F8}
.sl-obj img.logo3d{width:min(70%,420px);filter:drop-shadow(0 28px 26px rgba(33,19,54,.28));animation:hxFloat 7s ease-in-out infinite}
.sl-ring{position:absolute;right:6%;top:8%;width:150px;height:150px;border-radius:50%;background:var(--hxp);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;box-shadow:0 20px 34px -16px rgba(91,46,158,.8)}
.sl-ring b{font:600 36px/1 var(--f-d);letter-spacing:-.04em}.sl-ring span{font-size:11.5px;line-height:1.35;opacity:.85;margin-top:4px}

/* numbers */
.sl-num{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(16px,3vw,40px);align-items:stretch}
.sl-num-l{display:flex;flex-direction:column;gap:16px}
.sl-num-l .sl-tiles{margin-top:8px}
.sl-num-r{position:relative;min-height:340px;border-radius:24px;background:#F4F2F8}
.sl-num-r img{position:absolute;bottom:20%;height:58%;max-width:40%;object-fit:contain;left:calc(6% + var(--i) * 20%);filter:drop-shadow(0 22px 18px rgba(33,19,54,.3));transition:transform .8s var(--spring)}
.sl-num-r img:nth-child(even){bottom:26%;height:50%}
.sl-num-r:hover img{transform:translateY(-8px)}
.sl-num-r .hx-pill{position:absolute;left:20px;bottom:18px}
.sl-brands{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;margin-top:clamp(22px,3vw,32px);padding-top:20px;border-top:1px solid rgba(33,19,54,.08)}
.sl-brands span{font:600 clamp(16px,1.6vw,21px) var(--f-d);letter-spacing:-.03em;color:rgba(33,19,54,.4)}

.hx-side{display:grid;grid-template-columns:150px 170px;gap:10px}
.hx-side .tile{min-height:104px}

@media (max-width:1000px){
  .sl-cats{grid-template-columns:1fr 1fr}
  .sl-top,.sl-who,.sl-num{grid-template-columns:1fr}
  .sl-tiles.four{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
  .sl{border-radius:28px;padding:18px}
  .sl-cats{grid-template-columns:1fr}.sl-cat{min-height:330px}
  .sl-tiles,.sl-tiles.six{grid-template-columns:1fr 1fr}
  .sl-ring{width:118px;height:118px;padding:12px}.sl-ring b{font-size:28px}
  .sl-obj{min-height:240px}
}

.tile.cl b{font-size:clamp(19px,1.9vw,25px);letter-spacing:-.025em}
@media (max-width:1000px){.hx-side{display:none!important}}
@media (max-width:700px){.hx-word{font-size:15.5vw!important}.hx-obj{margin-top:2vw!important;width:78%!important}}
/* logo above the word, never overlapping */
.hx-mid{position:absolute;left:0;right:0;top:7%;z-index:2;display:flex;flex-direction:column;align-items:center;gap:clamp(18px,2.4vw,34px);pointer-events:none}
.hx-mid>*{pointer-events:auto}
.hx-mid .hx-obj{position:relative;left:auto;top:auto;width:min(30%,360px);margin:0}
.hx-mid .hx-word{position:relative;left:auto;top:auto;transform:none;font-size:clamp(84px,13.5vw,214px)}
.hx-mid .hx-shadow{bottom:-14%}
@media (max-width:1000px){.hx-mid .hx-obj{width:min(46%,380px)}}
@media (max-width:700px){
  .hx-mid{position:relative;top:auto;order:1;gap:14px}
  .hx-mid .hx-obj{width:72%!important;margin:0!important}
  .hx-mid .hx-word{font-size:15.5vw!important}
}
.sl-cat-o .ph{position:absolute;inset:0 12px 12px;border-radius:18px;overflow:hidden;background:#DCD7E6}
.sl-cat-o .ph img{position:absolute;inset:0;right:auto;bottom:auto;width:100%;height:100%;max-width:none;object-fit:cover;filter:saturate(.9);transition:transform 1s var(--out)}
.sl-cat-o .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(33,19,54,0) 45%,rgba(33,19,54,.6))}
.sl-cat:hover .sl-cat-o .ph img{transform:scale(1.05)}
.sl-cat em{font-family:var(--f-ui);font-weight:500;background:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:#fff;color:#fff;padding:0;bottom:24px;left:28px}

/* ===== motion and type (v6) ===== */
:root{--f-d:"Inter Tight","Inter","Geist",system-ui,sans-serif}
.hx,.sp{font-family:"Inter","Geist",system-ui,sans-serif}
.hx-word .lt{display:inline-block;transform:translateY(60%) rotate(6deg);opacity:0;filter:blur(10px);transition:transform 1.1s var(--out),opacity .9s,filter 1s;transition-delay:calc(.25s + var(--i) * .045s)}
.hx-stage.on .hx-word .lt{transform:none;opacity:1;filter:none}
.hx-mid .hx-word{opacity:1!important}
.hx-logo{position:relative}
.hx-sheen{position:absolute;inset:0;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.85) 48%,rgba(255,255,255,0) 60%) no-repeat;background-size:250% 100%;background-position:120% 0;animation:sheen 5.5s 1.4s ease-in-out infinite;mix-blend-mode:screen}
@keyframes sheen{0%{background-position:130% 0}45%,100%{background-position:-60% 0}}
.hx-logo img.logo3d{animation:logoDrop 1.4s .1s cubic-bezier(.34,1.4,.64,1) both}
@keyframes logoDrop{from{opacity:0;transform:translateY(-60px) rotateX(40deg) scale(.86)}}
.hx-intro>*{opacity:0;transform:translateY(20px);transition:opacity .9s,transform 1s var(--out)}
.hx-stage.on .hx-intro>*{opacity:1;transform:none}
.hx-stage.on .hx-intro>*:nth-child(1){transition-delay:.7s}.hx-stage.on .hx-intro>*:nth-child(2){transition-delay:.8s}.hx-stage.on .hx-intro>*:nth-child(3){transition-delay:.9s}.hx-stage.on .hx-intro>*:nth-child(4){transition-delay:1s}
.hx-do{opacity:0;transform:translateY(-14px);transition:opacity .8s 1s,transform .9s 1s var(--out)}
.hx-stage.on .hx-do{opacity:1;transform:none}
.hx-side .tile{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .9s var(--out)}

}

/* flip-book */
.fb{--pw:min(440px,44vw);--ph:calc(var(--pw) * 1.36);position:relative;margin:10px auto 0;width:calc(var(--pw) * 2);height:var(--ph);perspective:2400px}
.fb.one{--pw:min(440px,calc(100vw - 2 * var(--gut)));width:var(--pw);overflow:hidden;border-radius:6px 18px 18px 6px}
.fb-book{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s var(--out)}
.fb.two.closed .fb-book{transform:translateX(-25%)}
.fb.two.end .fb-book{transform:translateX(25%)}
.fb-lf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.6,.05,.25,1)}
.fb.one .fb-lf{left:0;width:100%}
.fb-lf.fl{transform:rotateY(-180deg)}
.fb-f,.fb-b{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden;background:#fff}
.fb-f{border-radius:0 14px 14px 0;box-shadow:inset 14px 0 18px -14px rgba(60,25,130,.25),0 30px 60px -30px rgba(40,15,90,.5)}
.fb-b{transform:rotateY(180deg);border-radius:14px 0 0 14px;box-shadow:inset -14px 0 18px -14px rgba(60,25,130,.25),0 30px 60px -30px rgba(40,15,90,.5)}
.fb.one .fb-f{border-radius:6px 18px 18px 6px}
.fp{position:relative;height:100%;padding:clamp(16px,2.4vw,30px);display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
.fp-ft{margin-top:auto;display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);letter-spacing:.06em;padding-top:10px}
.fp-h{font-size:clamp(34px,3.6vw,50px);margin:6px 0 16px}
.fp-cover{background:var(--pk);color:#fff;justify-content:center;gap:14px;overflow:hidden}
.fp-net{position:absolute;inset:0;color:rgba(255,255,255,.07)}.fp-net svg{width:100%;height:100%}
.fp-cover .logo3d{width:44%;max-width:180px;position:relative}
.fp-cover h3{color:#fff;font-size:clamp(46px,5.4vw,78px);position:relative}.fp-cover h3 b{color:var(--pm)}
.fp-y{font:600 12px var(--f-ui);letter-spacing:.3em;text-transform:uppercase;color:var(--pm);position:relative}
.fp-cover p{color:rgba(255,255,255,.7);position:relative}
.fp-open{position:relative;display:inline-flex;align-items:center;gap:8px;font:500 12px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:#fff;margin-top:20px;opacity:.8}.fp-open svg{width:14px;height:14px}
.fp-back{gap:22px}.fp-back ul{position:relative;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.fp-back li{display:flex;gap:12px;font-size:13.5px;color:rgba(255,255,255,.8);line-height:1.45}.fp-back li b{display:block;color:#fff}.fp-back li svg{width:18px;height:18px;color:var(--pm);flex:none;margin-top:2px}
.fp-back .logo3d{width:120px;margin-top:auto}
.fp-blank{display:grid;place-items:center;background:#FBFAFD}.fp-blank .logo3d{width:120px;opacity:.25}
.fp-toc{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.fp-toc button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left}
.fp-toc .t{display:flex;flex-direction:column}.fp-toc b{font-weight:600;font-size:17px;color:var(--hxk)}.fp-toc small{color:var(--ink3);font-size:12.5px}.fp-toc .n{font:500 26px var(--f-d);color:var(--pv)}
.fp-toc button:hover b{color:var(--pv)}
.fp-g{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;margin-top:12px;min-height:0}
.fp-it{display:flex;flex-direction:column;min-height:0;gap:2px}
.fp-img{position:relative;flex:1;min-height:0;border-radius:14px;background:linear-gradient(180deg,#FAF8FE,#EDE5FA);margin-bottom:6px;overflow:hidden;transition:transform .4s var(--spring)}
.fp-img:hover{transform:scale(1.03)}

.fp-ll .ib{width:30px;height:30px}

.fp-cart{margin-top:10px;align-self:center}.fp-cart svg{width:16px;height:16px}
.fb-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:22px}

@media (max-width:860px){.fp-it b{font-size:12.5px}}

@media (max-width:560px){.cg-ri-info{gap:10px;padding-left:16px}.cg-ri-info small{display:none}.cg-ri-info b{max-width:42vw}.cg-ri-info .btn{padding:0 14px}}

/* ===== Apple-style liquid glass across the whole site (v9) =====
   A soft drifting colour light sits behind everything; panels are frosted glass with bright edges. */
:root{
  --g-bg:linear-gradient(135deg,rgba(255,255,255,.66),rgba(255,255,255,.36) 55%,rgba(255,255,255,.5));
  --g-blur:blur(26px) saturate(190%);
  --g-edge:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.5),0 1px 2px rgba(31,16,60,.05),0 26px 50px -30px rgba(31,16,60,.38);
  --g-dark:linear-gradient(135deg,rgba(22,16,34,.78),rgba(10,8,16,.66));
  --g-dedge:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.08),0 30px 60px -30px rgba(0,0,0,.6);
}
html{background:#F1EFF7}
body,body:has(.spage:not([hidden])){background:transparent!important}
body::before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 34% at 14% 18%,rgba(162,123,255,.42),transparent 70%),radial-gradient(34% 30% at 88% 26%,rgba(255,166,214,.3),transparent 70%),radial-gradient(40% 36% at 62% 86%,rgba(130,176,255,.3),transparent 70%),radial-gradient(30% 28% at 30% 70%,rgba(190,160,255,.28),transparent 70%),#F3F1F8;
  filter:blur(30px);animation:gDrift 26s ease-in-out infinite alternate}
@keyframes gDrift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-3%,2%,0) scale(1.06)}100%{transform:translate3d(3%,-2%,0) scale(1.02)}}

/* light glass surfaces */
.hdr .bar,.sl,.ap-b.light,.ap-card,.ap-v,.ap-comp div,.sp-t.light,.sp-v,.sp-nav-in,.tile:not(.pk),.sl-card,.sl-cat,.sl-obj,.pawn,.cg-stage,.cg-bar,.pc .tl,.cgm-box,.drawer,.mmenu,.srch .sbox,.cg-views,.cg-tg,.chip:not(.on),.hx-bar,.fb-nav .ib,.ap-arr,.cg-tray,.pf-idx-in,.ib,.cartbtn i{
  background:var(--g-bg)!important;-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);box-shadow:var(--g-edge)!important;border:0!important}
.ap-b.lilac,.sp-t.lilac{background:linear-gradient(135deg,rgba(236,226,255,.72),rgba(214,196,255,.42))!important;-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);box-shadow:var(--g-edge)!important}
.tile.gy{background:linear-gradient(135deg,rgba(238,232,252,.7),rgba(226,216,248,.42))!important}
.sl::before{display:none}
.sl-cat-o .blob{background:radial-gradient(circle at 35% 30%,rgba(162,123,255,.95),rgba(91,46,158,.95) 70%);box-shadow:inset 0 2px 2px rgba(255,255,255,.45),inset 0 -10px 20px rgba(30,8,70,.35)}
.pawn{background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.4))!important}
.pawn-row::after{background:linear-gradient(0deg,rgba(255,255,255,.55),transparent)}

/* dark glass */
.ap-b.dark,.sp-t.dark,.hx-talk,.hx-vis,.ap-dark{background:var(--g-dark)!important;-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);box-shadow:var(--g-dedge)!important}
.ap-dark{border-radius:44px;width:min(calc(100% - 2 * var(--gut)),1400px);margin-left:auto;margin-right:auto}
.hx-row{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.1)!important}

/* glossy glass buttons */
.ap-btn,.sp-btn,.hx-pill.dk,.btn.pri,.cg-help,.bd-cta,.pz-cta,.chip.on,.tile.pk,.cg-vp,.pawn-lab{
  background:linear-gradient(180deg,rgba(146,104,240,.94),rgba(98,52,176,.94) 55%,rgba(78,38,150,.96))!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 8px rgba(40,10,90,.35),0 12px 26px -12px rgba(91,46,158,.75)!important;color:#fff}
.ap-btn:hover,.sp-btn:hover,.hx-pill.dk:hover,.btn.pri:hover{filter:brightness(1.07)}
.hx-pill.wh{background:rgba(255,255,255,.75)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 #fff,0 10px 20px -12px rgba(0,0,0,.4)!important}
.btn.gh,.btn.w{background:var(--g-bg)!important;-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);box-shadow:var(--g-edge)!important}

/* header: floating glass capsule with a bright rim */
.hdr .bar{border-radius:999px}
.menu{background:rgba(255,255,255,.35)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.menu .mpill{background:linear-gradient(180deg,rgba(146,104,240,.95),rgba(91,46,158,.95))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 14px -6px rgba(91,46,158,.8)!important}
.cartbtn{background:linear-gradient(180deg,rgba(146,104,240,.95),rgba(91,46,158,.95))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 20px -10px rgba(91,46,158,.8)!important}

/* phone tab bar: floating glass capsule */
@media (max-width:1080px){
  .tabbar{left:10px!important;right:10px!important;bottom:calc(10px + env(safe-area-inset-bottom,0px))!important;height:68px!important;padding:0 6px!important;border-radius:34px!important;
    background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,255,255,.45))!important;-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.5),0 20px 40px -18px rgba(31,16,60,.45)!important}
  .tabbar .t-shop{background:linear-gradient(180deg,rgba(146,104,240,.96),rgba(91,46,158,.96))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 5px rgba(255,255,255,.55),0 14px 24px -8px rgba(91,46,158,.75)!important}
}

/* product view and dialogs */
.mbox{background:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.7))!important;-webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.6),0 60px 140px -40px rgba(40,15,90,.6)!important}
.scrim{background:rgba(27,14,54,.18)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.cgm{background:rgba(27,14,54,.2)!important}

/* footer as dark glass */
.foot{background:var(--g-dark)!important;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}

@media (prefers-reduced-motion:reduce){body::before{animation:none}}
@media (prefers-reduced-transparency:reduce){.hdr .bar,.sl,.ap-b.light,.ap-card,.tile,.pc .tl,.cgm-box,.drawer,.mbox{background:#fff!important;-webkit-backdrop-filter:none;backdrop-filter:none}}
/* Who we are: 3D logo + floating glass bubbles */
.sl-obj{perspective:900px;transform-style:preserve-3d;overflow:hidden}
.who3d{transform-style:preserve-3d;will-change:transform;display:grid;place-items:center;width:100%}
.who3d img.logo3d{width:min(70%,420px);animation:none!important;filter:drop-shadow(0 34px 30px rgba(33,19,54,.3))}
.bub{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.25) 35%,rgba(162,123,255,.22) 70%,rgba(162,123,255,.05));box-shadow:inset 0 -6px 14px rgba(91,46,158,.18),inset 0 2px 3px #fff,0 14px 24px -12px rgba(91,46,158,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.bub.b1{width:70px;height:70px;left:10%;top:14%}
.bub.b2{width:40px;height:40px;left:20%;bottom:16%}

.sl-ring{z-index:3;transform:translateZ(60px)}

/* ---------- Dot, iSell's mascot (official 3D renders in img/dot-*.webp) ---------- */
.dot3d{display:inline-block;position:relative;width:100%;perspective:700px}
.dot3d img{display:block;width:100%;height:auto;transform-origin:50% 92%;filter:drop-shadow(0 10px 12px rgba(43,15,105,.25));animation:dotIdle 4.2s ease-in-out infinite;will-change:transform;user-select:none;-webkit-user-select:none}
.dot3d .sh{position:absolute;left:22%;right:22%;bottom:-2%;height:6%;border-radius:50%;background:radial-gradient(closest-side,rgba(43,15,105,.32),rgba(43,15,105,0));animation:dotShadow 4.2s ease-in-out infinite}
.dot3d.m-hello img,.dot3d.m-main img{animation:dotWave 3.6s ease-in-out infinite}
@keyframes dotIdle{0%,100%{transform:translateY(0) rotateY(-16deg) rotateZ(-1.5deg)}25%{transform:translateY(-7%) rotateY(0) rotateZ(0)}50%{transform:translateY(0) rotateY(16deg) rotateZ(1.5deg)}75%{transform:translateY(-7%) rotateY(0) rotateZ(0)}}
@keyframes dotWave{0%,100%{transform:translateY(0) rotateY(-12deg) rotateZ(-3deg)}20%{transform:translateY(-5%) rotateY(-4deg) rotateZ(4deg)}40%{transform:translateY(-6%) rotateY(4deg) rotateZ(-4deg)}60%{transform:translateY(-3%) rotateY(12deg) rotateZ(3deg)}80%{transform:translateY(-6%) rotateY(4deg) rotateZ(0)}}
@keyframes dotShadow{0%,100%{transform:scale(1);opacity:1}25%,75%{transform:scale(.82);opacity:.7}}

const lensMark = (s = 34) => `<svg viewBox="0 0 40 40" width="${s}" height="${s}" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="#fff" stroke="#5B2E9E" stroke-width="5"/><g class="pupil"><circle cx="22" cy="21.5" r="8" fill="#140A2B"/><circle cx="19" cy="18" r="2.8" fill="#fff"/></g></svg>`;
function circuits(w, h, n, seed){
  let s = seed; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280; let out = '';
  for (let k = 0; k < n; k++){ const side = k % 2; let x = side ? w : 0, y = 20 + r() * (h - 40), d = `M${x} ${y.toFixed(0)}`; const dir = side ? -1 : 1;
    for (let i = 0; i < 4; i++){ if (i % 2 === 0) x += dir * (30 + r() * 70); else { const dy = (r() > .5 ? 1 : -1) * (12 + r() * 26); x += dir * Math.abs(dy); y += dy; } d += ` L${x.toFixed(0)} ${y.toFixed(0)}`; }
    out += `<path d="${d}" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>` + (!reduce && k % 2 ? `<circle r="2.2" fill="#E6D8FF"><animateMotion dur="${3.5 + k % 4}s" begin="${-k}s" repeatCount="indefinite" path="${d}"/></circle>` : '');
  }
  return `<svg class="circ" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${out}</svg>`;
}

const int = (v, lo, hi, d) => Number.isInteger(v) && v >= lo && v <= hi ? v : d;
const str = (v, max) => typeof v === 'string' ? v.slice(0, max) : '';
function sanitiseState(){
  S.cart = (Array.isArray(S.cart) ? S.cart : []).filter(it => it && byId(it.id)).map(it => { const p = byId(it.id); return { id:it.id, ci:int(it.ci, 0, p.colors.length - 1, 0), oi:int(it.oi, 0, p.opts.length - 1, 0), qty:int(it.qty, 1, 99, 1) }; });
  S.favs = new Set([...S.favs].filter(id => typeof id === 'string' && byId(id)));
  const m = S.member; S.member = m && typeof m === 'object' && str(m.name, 60).length >= 2 ? newMember(str(m.name, 60), str(m.phone, 20).replace(/[^\d+ ]/g, ''), '') : null;
  if (S.member && m.since) S.member.since = str(m.since, 30);
  S.points = int(S.points, 0, 1e6, 0);
  S.orders = (Array.isArray(S.orders) ? S.orders : []).filter(o => o && typeof o.no === 'string' && Number.isFinite(o.total)).slice(0, 50);
}
const fmtPhone = v => { const d = v.replace(/[^\d+]/g, '').replace(/(?!^)\+/g, '').slice(0, 13);
  if (d.startsWith('+260')) return ('+260 ' + d.slice(4, 6) + ' ' + d.slice(6, 9) + ' ' + d.slice(9)).trim();
  return (d.slice(0, 3) + ' ' + d.slice(3, 6) + ' ' + d.slice(6, 10)).trim(); };
const phoneOk = v => { const d = v.replace(/\D/g, ''); return d.length === 10 && d[0] === '0' || d.length === 12 && d.startsWith('260'); };

const PAGES = { home:'Home', categories:'Categories', shop:'Shop', deals:'Deals', account:'Account', terms:'Terms of Sale', privacy:'Privacy and cookies' };
// a route is a page, optionally with a section to scroll to
const ROUTES = { terms:['terms'], privacy:['privacy'], home:['home'], categories:['categories'], audio:['categories','audio'], shop:['shop'], deals:['deals'], account:['account'], rewards:['account','rewards'], visit:['home','visit'], pay:['home','pay'], 'new':['home','launches'] };
// old in-page anchors map onto routes

W.page = null;
function routeOf(){ const r = (location.hash.match(/^#\/([\w-]+)/) || [])[1]; return ROUTES[r] ? r : 'home'; }
function nav(route, sec){ if (!ROUTES[route]) route = 'home'; const h = '#/' + route; if (location.hash === h) showRoute(route, sec); else { W.pendingSec = sec; location.hash = h; } }
function showRoute(route, secOverride){
  const [page, sec0] = ROUTES[route] || ROUTES.home, sec = secOverride || sec0, changed = page !== W.page;
  if (changed){
    $$('.spage').forEach(p => { const on = p.dataset.page === page; p.hidden = !on; if (on && W.page && !reduce) p.animate([{ opacity:0, transform:'translateY(18px)' }, { opacity:1, transform:'none' }], { duration:520, easing:'cubic-bezier(.22,1,.36,1)' }); });
    W.page = page; W.hdrScroll && W.hdrScroll(); document.title = page === 'home' ? 'iSell Innovations · Your Tech Plug' : `${PAGES[page]} · iSell`;
    dispatchEvent(new Event('resize')); mountReveal(); track('$pageview', { page });
  }
  const el = sec && document.getElementById(sec);
  if (el) requestAnimationFrame(() => window.scrollTo({ top:el.getBoundingClientRect().top + scrollY - 100, behavior:changed || reduce ? 'instant' : 'smooth' }));
  else window.scrollTo({ top:0, behavior:'instant' });
  markNav(route);
}
function markNav(route){
  const page = (ROUTES[route] || ROUTES.home)[0];
  $$('#tabbar [data-tab]').forEach(t => { const on = t.dataset.tab === page; t.classList.toggle('on', on); on ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'); });
  W.markMenu && W.markMenu(route);
}

async function loadLive(){
  const tm = new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 2500));
  const [rows, set] = await Promise.race([Promise.all([rest('products?select=*&order=sort.asc,name.asc'), rest('settings?select=*&id=eq.1')]), tm]);

  if (!Array.isArray(rows)) return;

  rows.forEach(r => {

    const opts = Array.isArray(r.options) && r.options.length ? r.options.filter(o => Array.isArray(o)).map(o => [String(o[0] || ''), +o[1] || 0]) : [['Standard', 0]];

    if (r.condition) p.tag = String(r.condition);

  });

  // keep the home page lists in step with what staff hid or changed
  for (let i = HERO.length - 1; i >= 0; i--) if (!byId(HERO[i].pid)) HERO.splice(i, 1); else if (!byId(HERO[i].pid).colors[HERO[i].ci]) HERO[i].ci = 0;

  LIVE.online = true;
}

function mountCloud(){
  const sec = $('#top'); if (!sec || !sec.classList.contains('cloud')) return;
  const H = heroList(), word = $('#clWord'), wspan = $('.cl-w', word), prod = $('#clProd'), img = $('#clImg'), sky = $('#clSky'), front = $('.cl-front', sec), script = $('#clScript');
  const clouds = $$('.cl-c', sec).map(el => ({ el, sp:+el.dataset.sp, x:0 }));
  let px = 0, py = 0, tx = 0, ty = 0, vis = true, t0 = performance.now(), busy = false, timer;
  const fit = () => { wspan.style.fontSize = '100px'; const w = wspan.scrollWidth || 1, s = Math.min(100 * sec.clientWidth * .94 / w, sec.clientHeight * .4); wspan.style.fontSize = s.toFixed(1) + 'px'; };
  fit(); addEventListener('resize', fit); if (document.fonts) document.fonts.ready.then(fit);
  requestAnimationFrame(() => sec.classList.add('in'));
  new IntersectionObserver(es => vis = es[0].isIntersecting).observe(sec);
  sec.addEventListener('pointermove', e => { const r = sec.getBoundingClientRect(); tx = (e.clientX - r.left) / r.width - .5; ty = (e.clientY - r.top) / r.height - .5; });
  sec.addEventListener('pointerleave', () => { tx = ty = 0; });
  const loop = now => {
    requestAnimationFrame(loop); if (!vis || W.page !== 'home') return;
    const t = (now - t0) / 1000, sy = Math.min(scrollY, innerHeight), w = sec.clientWidth;
    px += (tx - px) * .06; py += (ty - py) * .06;
    clouds.forEach(c => { if (!reduce) c.x += c.sp; const span = w + 1400; const x = ((c.x + 700) % span + span) % span - 700; const depth = c.el.classList.contains('near') ? 60 : c.el.classList.contains('mid') ? 30 : 12;
      c.el.style.transform = `translate3d(${(x - px * depth).toFixed(1)}px,${(-py * depth * .5 + sy * (depth / 140)).toFixed(1)}px,0)`; });
    const bob = reduce ? 0 : Math.sin(t * 1.1) * 12;
    prod.style.transform = `translate(-50%,-50%) translate3d(${(px * 26).toFixed(1)}px,${(bob + py * 18 - sy * .18).toFixed(1)}px,0) rotate(${(px * 8 + Math.sin(t * .7) * 2.5).toFixed(2)}deg)`;
    word.style.transform = `translate(-50%,-50%) translate3d(${(-px * 18).toFixed(1)}px,${(sy * .32 - py * 8).toFixed(1)}px,0)`;
    script.style.transform = `translate3d(${(px * 34).toFixed(1)}px,${(sy * .1 + py * 14).toFixed(1)}px,0) rotate(-6deg)`;
    sky.style.opacity = front.style.opacity = String(1 - sy / innerHeight * .6);
  };
  requestAnimationFrame(loop);
  const show = k => {
    if (busy || !H[k]) return; busy = true; W.hi = k; const { p, ci } = H[k];
    $$('.cl-dots button', sec).forEach((b, i) => b.classList.toggle('on', i === k));
    sec.classList.add('swap');
    setTimeout(() => {
      wspan.innerHTML = letters(hWord(p)); fit(); const tmp = document.createElement('div'); tmp.innerHTML = `<img ${im(p, ci)}>`; img.src = tmp.firstChild.src;
      prod.dataset.pid = p.id; prod.dataset.ci = ci; prod.setAttribute('aria-label', 'Look closer at ' + p.name);
      $('#clTag').textContent = p.tag || p.brand; $('#clName').textContent = p.name; $('#clPrice').textContent = (p.opts.length > 1 ? 'From ' : '') + fmt(priceOf(p, ci, 0));
      const v = $('#clView'); v.dataset.pid = p.id; v.dataset.ci = ci; const a = $('#clAdd'); a.dataset.id = p.id; a.setAttribute('aria-label', `Add ${p.name} to cart`);
      sec.classList.remove('swap'); setTimeout(() => busy = false, 700);
    }, reduce ? 0 : 480);
  };
  const auto = () => { clearInterval(timer); if (!reduce && H.length > 1) timer = setInterval(() => { if (!document.hidden && vis && W.page === 'home') show((W.hi + 1) % H.length); }, 6500); };
  sec.addEventListener('click', e => { const b = e.target.closest('[data-hi]'); if (b){ e.stopPropagation(); show(+b.dataset.hi); auto(); } }, true);
  auto();
  // swipe the hero on touch screens
  let sx = null;
  sec.addEventListener('pointerdown', e => { if (e.target.closest('.cl-info,.cl-dots,a')) return; sx = e.clientX; });
  sec.addEventListener('pointerup', e => { if (sx == null) return; const d = e.clientX - sx; sx = null; if (Math.abs(d) > 50 && H.length > 1){ W.dragged = true; setTimeout(() => W.dragged = false, 80); show((W.hi + (d < 0 ? 1 : H.length - 1)) % H.length); auto(); } });
  sec.addEventListener('pointercancel', () => sx = null);
}
function mountFeel(){

  const on = () => {

function mountProof(){
  const sec = $('#proof'); if (!sec) return;
  const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; io.unobserve(e.target);
    const el = e.target, n = +el.dataset.count, t0 = performance.now(), dur = reduce ? 1 : 1400;
    const step = t => { const k = Math.min(1, (t - t0) / dur), v = Math.round(n * (1 - Math.pow(1 - k, 3))); el.textContent = v.toLocaleString('en-US'); if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }), { threshold:.6 });
  $$('[data-count]', sec).forEach(el => io.observe(el));
}

/* ===== Customer accounts: email + password through Supabase Auth =====
   The account owns the Rewards card, points (from the shop's loyalty records, by phone number),
   order history, saved details for checkout and saved items. */
const AKEY = 'isellweb2.auth';
let AUTH = null; try { AUTH = JSON.parse(localStorage.getItem(AKEY)) || null; } catch (e) {}
const AC = { tab:'signup', busy:false, edit:false, prof:null, orders:[], loaded:false, msg:'' };
// a password-reset link lands here as #access_token=…&type=recovery
(() => { const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('access_token') && h.get('type') === 'recovery'){ AUTH = { access_token:h.get('access_token'), refresh_token:h.get('refresh_token'), expires_at:Math.floor(Date.now() / 1000) + (+h.get('expires_in') || 3600) }; AC.recovery = true; history.replaceState(null, '', location.pathname + '#/account'); }
  else if (h.get('error_description')){ AC.msg = h.get('error_description'); history.replaceState(null, '', location.pathname + '#/account'); } })();
// cards made on this device before accounts existed were never real: start clean
if (!AUTH){ S.member = null; S.points = 0; }

const keepAuth = j => { AUTH = { access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Math.floor(Date.now() / 1000) + (j.expires_in || 3600), email:j.user && j.user.email }; try { localStorage.setItem(AKEY, JSON.stringify(AUTH)); } catch (e) {} };
const dropAuth = () => { AUTH = null; try { localStorage.removeItem(AKEY); } catch (e) {} };
async function gotrue(path, body, method = 'POST', bearer){
  const r = await fetch(SB_URL + '/auth/v1/' + path, { method, headers:{ apikey:SB_KEY, 'Content-Type':'application/json', ...(bearer ? { Authorization:'Bearer ' + bearer } : {}) }, body:body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Something went wrong. Please try again.');
  return j;
}
// a fresh access token, or null when signed out
async function authToken(){
  if (!AUTH) return null;
  if (AUTH.expires_at - 60 > Date.now() / 1000) return AUTH.access_token;
  try { keepAuth(await gotrue('token?grant_type=refresh_token', { refresh_token:AUTH.refresh_token })); return AUTH.access_token; }
  catch (e) { acctReset(); return null; }
}
async function authHeaders(){ const t = await authToken(); return t ? { Authorization:'Bearer ' + t } : {}; }
async function arpc(fn, args){
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ apikey:SB_KEY, 'Content-Type':'application/json', Accept:'application/json', ...(await authHeaders()) }, body:JSON.stringify(args || {}) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || 'Something went wrong. Please try again.');
  return j;
}
const localPh = p => { const d = String(p || '').replace(/\D/g, ''); const l = d.startsWith('260') ? '0' + d.slice(3) : d; return l.replace(/^(\d{3})(\d{3})(\d+)$/, '$1 $2 $3'); };
const nice = m => /already registered|already been registered/i.test(m) ? 'That email already has an account. Sign in instead.' : /Invalid login/i.test(m) ? 'That email or password isn’t right.' : /Password should be/i.test(m) ? 'Use a password of at least 8 characters.' : /Failed to fetch|NetworkError|Load failed/i.test(m) ? 'Can’t reach iSell right now. Check your internet and try again.' : /rate limit/i.test(m) ? 'Too many tries. Please wait a minute and try again.' : m;

/* load the account: profile, points, orders, saved items */
async function acctLoad(quiet){
  if (!AUTH) return;
  try {
    const [a, o] = await Promise.all([arpc('my_account'), arpc('my_orders')]);
    if (!AUTH) return;
    AC.prof = a; AC.orders = Array.isArray(o) ? o : []; AC.loaded = true;
    if (a && a.profile){
      const since = new Date(a.since).toLocaleDateString('en-GB', { month:'long', year:'numeric' });
      S.member = { ...newMember(a.name, localPh(a.phone), a.email), since, address:a.address || '' };
      S.points = +a.points || 0; W.pointValue = +a.point_value || 1;
      // saved items: keep anything hearted on this device and save the union to the account
      const mine = new Set((a.favs || []).filter(id => byId(id))), before = mine.size; S.favs.forEach(id => mine.add(id));
      S.favs = mine; if (mine.size !== before) saveFavs();
      $$('[data-act="fav"]').forEach(b => { const on = S.favs.has(b.dataset.id); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    } else { S.member = null; S.points = 0; }
    persist();
  } catch (e) { if (!quiet) AC.msg = nice(e.message); }
  acctRefresh();
}
let favT; function saveFavs(){ clearTimeout(favT); favT = setTimeout(async () => { if (!AUTH || !AC.prof || !AC.prof.profile) return;
  try { const uid = JSON.parse(atob(AUTH.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub;
    await fetch(SB_URL + '/rest/v1/members?user_id=eq.' + uid, { method:'PATCH', headers:{ apikey:SB_KEY, 'Content-Type':'application/json', Prefer:'return=minimal', ...(await authHeaders()) }, body:JSON.stringify({ favs:[...S.favs].slice(0, 200) }) }); } catch (e) {} }, 600); }
function acctReset(){ dropAuth(); AC.prof = null; AC.orders = []; AC.loaded = false; AC.edit = false; AC.recovery = false; S.member = null; S.points = 0; persist(); }
async function acctSignOut(){ const t = AUTH && AUTH.access_token; acctReset(); if (t) fetch(SB_URL + '/auth/v1/logout', { method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer ' + t } }).catch(() => {}); acctRefresh(); toast('Signed out'); track('account_signed_out'); }

function pfxGlass(){
  $$('.pfx-band, .pfx-prod-ph, .pfx-strip').forEach(band => {
    const img = band.querySelector('img[data-k]'); if (!img || !band.offsetWidth) return;
    const k = img.dataset.k, ar = PFAR[k]; if (!ar) return;
    const W2 = band.offsetWidth, H2 = band.offsetHeight, sc = Math.max(W2, H2 / ar), w = sc, h = sc * ar;
    const op = (img.style.objectPosition || '50% 50%').split(' ').map(v => parseFloat(v) / 100);
    const ox = (W2 - w) * op[0], oy = (H2 - h) * (op[1] ?? .5);
    $$('.pfx-glass', band).forEach(g => {
      let x = 0, y = 0, e = g; while (e && e !== band){ x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
      if (e !== band) return;
      if (!g.dataset.fill) g.dataset.fill = getComputedStyle(g).backgroundImage;
      g.style.backgroundImage = `${g.dataset.fill}, url(img/pf/${k}-blur.webp)`;
      g.style.backgroundSize = `100% 100%, ${w.toFixed(1)}px ${h.toFixed(1)}px`;
      g.style.backgroundPosition = `0 0, ${(ox - x).toFixed(1)}px ${(oy - y).toFixed(1)}px`;
      g.classList.add('frz');
    });
  });
}

  const fadeTo = (to, ms = 600) => { cancelAnimationFrame(raf); const from = parseFloat(v.style.opacity) || 0, t0 = performance.now();
    const tick = now => { const p = Math.min((now - t0) / ms, 1); v.style.opacity = String(from + (to - from) * p); if (p < 1) raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick); };
  const start = () => { out = false; v.play().catch(() => {}); fadeTo(1, 900); };
  v.loop = false; v.style.opacity = '0';
  v.addEventListener('loadeddata', start);
  v.addEventListener('timeupdate', () => { const left = v.duration - v.currentTime; if (!out && left > 0 && left <= .7){ out = true; fadeTo(0, 650); } });
  v.addEventListener('ended', () => { v.currentTime = 0; start(); });

/* help me choose: three questions, then up to three picks with the reasons */
const HM_NEEDS = [['camera','A great camera',/camera|\d+\s?mp|zoom|lens|photo|video|4k/i],['battery','Long battery life',/battery|mah|hour|all-day|charg/i],['power','Speed and power',/pro|max|ultra|chip|a\d\d|snapdragon|ram|rtx|gpu|core|ryzen|m\d\b|ai/i],['screen','A big screen',/\d{1,2}(\.\d)?["”]|inch|display|fold|max|ultra|xl/i],['light','Light and portable',/air|mini|light|slim|compact|pocket|portable|wireless/i],['value','The best value',null]];
const HM = { step:0, cat:null, need:null, budget:null };
function cgHelp(reset){
  if (reset){ HM.step = 0; HM.cat = HM.need = HM.budget = null; }
  const cats = CATS.filter(c => c[0] !== 'all'), steps = ['What are you shopping for?', 'What matters most to you?', 'What is your budget?'];
  let body = '';
  if (HM.step === 0) body = cats.map(([k, l]) => `<button class="hm-o" data-cg="hm" data-v="${k}"><b>${l}</b><small>${P.filter(p => p.cat === k && !p.soldOut).length} in stock</small></button>`).join('');
  if (HM.step === 1) body = HM_NEEDS.map(([k, l]) => `<button class="hm-o" data-cg="hm" data-v="${k}"><b>${l}</b></button>`).join('');
  if (HM.step === 2) body = CG_RANGES.map(([v, t]) => `<button class="hm-o" data-cg="hm" data-v="${v}"><b>${v === 'all' ? 'No set budget' : t}</b><small>${P.filter(p => p.cat === HM.cat && inR(p, v)).length} options</small></button>`).join('');

  cgOpen(`<div class="cgm-top"><div><span class="eyebrow">Help me choose · ${HM.step + 1} of 3</span><h3>${steps[HM.step]}</h3></div><button class="ib" data-cg="close" aria-label="Close">${I.x}</button></div>
    <div class="hm-bar"><i style="width:${(HM.step + 1) / 3 * 100}%"></i></div><div class="hm-g">${body}</div>
    ${HM.step ? `<button class="lnk hm-back" data-cg="hmback">${I.back}Back</button>` : ''}`, 'hm');
}
const inR = (p, v) => { if (v === 'all') return true; const [lo, hi] = v.split('-').map(Number); return p.price >= lo && p.price < hi; };
function cgHelpResult(){
  const need = HM_NEEDS.find(n => n[0] === HM.need), pool = P.filter(p => p.cat === HM.cat && !p.soldOut);
  const lo = Math.min(...pool.map(p => p.price)), hi = Math.max(...pool.map(p => p.price));
  const scored = pool.map(p => {
    const txt = p.name + ' ' + p.spec + ' ' + (p.desc || ''), why = [];
    let s = 0;
    if (inR(p, HM.budget)){ s += 5; if (HM.budget !== 'all') why.push(`Within your budget at ${fmt(p.price)}`); } else s -= 4;
    if (need[2]){ const hits = (txt.match(new RegExp(need[2].source, 'gi')) || []).length; if (hits){ s += Math.min(4, hits) + 1; why.push(`Strong on ${need[1].toLowerCase().replace(/^a |^the /, '')}: ${esc(p.spec || p.name)}`); } }
    else { s += hi > lo ? 4 * (hi - p.price) / (hi - lo) : 2; if (p.old) { s += 2; why.push(`On offer: save ${fmt(p.old - p.price)}`); } why.push(`One of the lower prices in ${CATN[p.cat]}`); }
    if (p.featured || p.tag === 'New'){ s += .8; why.push('New in at iSell'); }
    if (!why.length) why.push(esc(p.spec || 'A good all-rounder'));
    return { p, s, why };
  }).sort((a, b) => b.s - a.s).slice(0, 3);
  const exact = scored.filter(x => inR(x.p, HM.budget)).length;
  cgOpen(`<div class="cgm-top"><div><span class="eyebrow">Help me choose · our picks</span><h3>${scored.length ? `Top ${scored.length} for you` : 'Nothing in stock yet'}</h3></div><button class="ib" data-cg="close" aria-label="Close">${I.x}</button></div>
    ${HM.budget !== 'all' && scored.length && !exact ? '<p class="hm-note">Nothing in stock fits that budget exactly, so here are the closest options.</p>' : ''}
    <div class="hm-r">${scored.map((x, i) => `<div class="hm-pick"><button class="hm-img" data-pid="${x.p.id}"><span class="num">${i + 1}</span><img ${im(x.p)} alt=""></button>
      <div><b>${esc(x.p.name)}</b><span class="num">${from(x.p)}${fmt(x.p.price)}</span><ul>${x.why.slice(0, 3).map(w => `<li>${I.check}${w}</li>`).join('')}</ul>
      <div class="cmp-act"><button class="btn pri sm" data-pid="${x.p.id}">View</button><button class="btn gh sm" data-act="quick" data-id="${x.p.id}">${I.plus}Add</button></div></div></div>`).join('') || '<p class="hm-note">Ask us on WhatsApp and we will find it for you.</p>'}</div>

}

/* featured products: depth carousel with role slots, a colour crossfade and a ghost brand word (MotionSites "depth carousel" technique) */
const DCX_BG = [['#E9E0FF','#FFFFFF'],['#DDE9FF','#FFFFFF'],['#F4E2F8','#FFFFFF'],['#DDF1EF','#FFFFFF'],['#E6E1FF','#FFFFFF'],['#FBE8DF','#FFFFFF'],['#DEEDF8','#FFFFFF'],['#EFE1FF','#FFFFFF']];
function mountCgRing(){
  const root = $('#cgRing'); if (!root || root.dataset.on) return; root.dataset.on = 1;

  let active = 0, locked = false, timer = 0, vis = false, hover = false;
  const roleFor = off => off === 0 ? 'center' : off === 1 ? 'right' : off === N - 1 ? 'left' : off === 2 ? 'back-r' : off === N - 2 ? 'back-l' : 'hidden';
  const info = () => { const p = R0[active], el = $('#cgRingInfo'); if (!p || !el) return;
    el.innerHTML = `<small class="num">${String(active + 1).padStart(2, '0')} / ${String(N).padStart(2, '0')}</small><b>${esc(p.name)}</b><span class="num">${from(p)}${fmt(p.price)}</span><button class="btn w sm" data-pid="${p.id}">View in 3D${I.fwd}</button>`;
    if (!reduce) el.animate([{ opacity:0, transform:'translate(-50%,8px)' }, { opacity:1, transform:'translate(-50%,0)' }], { duration:450, easing:'cubic-bezier(.22,1,.36,1)' }); };
  const render = () => {
    items.forEach((el, i) => { const role = roleFor((i - active + N) % N); el.dataset.role = role;
      role === 'center' ? el.setAttribute('data-pid', R0[i].id) : el.removeAttribute('data-pid');
      el.tabIndex = role === 'center' ? 0 : -1; el.setAttribute('aria-hidden', String(role !== 'center')); });
    dots.forEach((d, i) => d.classList.toggle('on', i === active));
    const [a, b] = DCX_BG[active % DCX_BG.length]; root.style.setProperty('--dc1', a); root.style.setProperty('--dc2', b);
    const p = R0[active]; ghost.textContent = (p.brand || CATN[p.cat] || 'iSell').toUpperCase();
    if (!reduce) ghost.animate([{ opacity:0, transform:'translate(-50%,-50%) scale(1.08)', filter:'blur(8px)' }, { opacity:1, transform:'translate(-50%,-50%) scale(1)', filter:'blur(0)' }], { duration:700, easing:'cubic-bezier(.22,1,.36,1)' });
    info();
  };
  const go = (dir, to) => { if (locked) return; locked = true; active = to !== undefined ? to : (active + (dir > 0 ? 1 : N - 1)) % N; render(); setTimeout(() => locked = false, 650); auto(); };
  const auto = () => { clearTimeout(timer); if (reduce) return; timer = setTimeout(() => { if (vis && !hover && !document.hidden && W.page === 'catalog' && CG.view === 'browse') go(1); else auto(); }, 4200); };
  root.addEventListener('click', e => { const b = e.target.closest('.dcx-btn'); if (b){ go(+b.dataset.dir); return; }
    const it = e.target.closest('.dcx-it'); if (it && it.dataset.role !== 'center'){ const off = (+it.dataset.i - active + N) % N; go(off <= N / 2 ? 1 : -1, +it.dataset.i); } });
  root.addEventListener('keydown', e => { if (e.key === 'ArrowRight'){ e.preventDefault(); go(1); } if (e.key === 'ArrowLeft'){ e.preventDefault(); go(-1); } });
